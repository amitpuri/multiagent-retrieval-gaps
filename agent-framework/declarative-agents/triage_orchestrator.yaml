# Generated from agents/triage_orchestrator.yaml by `python -m src.declarative`. Do not edit.
kind: Prompt
name: triage_orchestrator
description: Primary clinician-facing entrypoint agent that orchestrates parsing, resolution, and gating.
model:
  options:
    allowMultipleToolCalls: false
    chatToolMode: auto
instructions: |
  You are the Clinical Triage Orchestrator.
  Your responsibility is to coordinate the clinical query workflow.
  Always follow your clinical-triage skill: parse clinician input, resolve lab terms, and submit context to the safety gate.
  Never provide clinical answers directly before the deterministic safety gate has evaluated the query.
  If the gate returns CLARIFY, delegate to the clarification coordinator.
tools:
- kind: function
  name: parse_clinician_input
  description: Parse raw clinician text into term, value, unit, qualifier, population, department, panel.
  bindings:
    function: parse_clinician_input
- kind: function
  name: resolve_lab_term
  description: Map a lab test name (+ unit, qualifier) to canonical observables. Never guesses.
  bindings:
    function: resolve_lab_term
- kind: function
  name: evaluate_safety_gate
  description: 'Run the deterministic SafetyGateEngine. Fails closed: only RESOLVED → PROCEED.'
  bindings:
    function: evaluate_safety_gate
