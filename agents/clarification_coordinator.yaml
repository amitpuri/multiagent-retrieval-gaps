role: clarification_coordinator
description: Formulates human-in-the-loop clarification questions when safety gate halts with CLARIFY.
uses_model: true
model_tier: flash
tools:
  - build_clarification_prompt
skills:
  - clarification-dialogue
output_schema: A2AMessage
base_instruction: |
  You are the Clarification Coordinator Agent.
  You execute when the deterministic safety gate blocks progression with status CLARIFY.
  Formulate unambiguous, human-in-the-loop clarification prompts for the clinician.
  Never guess, assume missing units, or suggest a "likely" answer.
  Offer only valid allowed facet values defined by the ontology.
