  "loinc:17861-6":
    label: "Calcium [Mass/volume] in Serum or Plasma"
    display_name: "Total calcium"
    axes: { component: "Calcium", property: MCnc, time: Pt, system: Ser/Plas, scale: Qn }
    axes_verified: false
    measures: calcium
    facets: { fraction: total }
    # mmol/L results are a different LOINC Property (SCnc). Convention (ADR 0002):
    # one observable per analyte fraction, with property-specific codings.
    units: ["mg/dL", "mmol/L"]
    property_codings:
      SCnc: "loinc:2000-8"
    specimen: "specimen:serum_plasma"
    department: "dept:clinical_biochemistry"
