# Observables (LOINC-coded lab tests). Term → observable mapping lives in
# designations.yaml; numbers live in intervals.yaml. Axes are derived from the
# LOINC long common name and flagged for verification (axes_verified: false).

schema_version: "1.0.0"

_provenance_loinc: &prov_human
