# Laboratory medicine domain pack — manifest.
# Imports the core upper ontology; every other file in this directory holds instances.

schema_version: "1.0.0"
id: laboratory_medicine
version: "1.0.0"
imports: [core]
label: "Laboratory Medicine"
description: >
  Controlled vocabulary, look-alike hazards, reference intervals, protocols and
  specimen-sequencing rules for laboratory decision support.
disclaimer: >
  Reference values in this pack are demonstration values generated by
  reference_agent/gemini-2.5-pro. They are NOT clinically validated
  (intervals carry clinically_unvalidated: true and verified_by: null).
  Do not use in production clinical systems without laboratory sign-off.
terminology_releases:
  loinc: "2026 release (codes and axes to be re-verified against the release in use — see docs/adr/0002)"
  ucum: "2.2"
files:
  - vocabulary.yaml
  - analytes.yaml
  - facets.yaml
  - observables.yaml
  - designations.yaml
  - intervals.yaml
  - protocols.yaml
  - panels.yaml
