# Numeric Reference and Critical Ranges with Range Collision Rules
# Prevents lethal misinterpretations between look-alike assays.
#
# IMPORTANT — unit handling:
#   All ranges are in their declared `unit`. The classify() method in NumericAssay
#   does NOT auto-convert units. If a value arrives in mmol/L, the caller MUST
#   convert before calling classify(), or use the mmol/L assay entries below.
#
#   Conversion factors (exact):
#     Total calcium:   1 mg/dL = 0.2495 mmol/L   (inverse: 1 mmol/L = 4.008 mg/dL)
#     Ionized calcium: same factor as total calcium
#
# DISCLAIMER: These are demo reference values generated by Gemini 2.5 Pro.
# They are NOT clinically validated. Do not use in production clinical systems
# without review against your laboratory's validated reference intervals.

domain: "laboratory_medicine"
version: "1.1.0"

assays:
  total_calcium:
    uri: "loinc:17861-6"
    name: "Total calcium"
    qualifiers:
      - "total"
      - "tca"
      - "total calcium"
    unit: "mg/dL"
    ref_low: 8.5
    ref_high: 10.5
    crit_low: 6.0
    crit_high: 13.0

  # mmol/L entry for total calcium (values converted from mg/dL via factor 0.2495)
  total_calcium_mmol:
    uri: "loinc:17861-6"
    name: "Total calcium"
    qualifiers:
      - "total"
      - "tca"
      - "total calcium"
    unit: "mmol/L"
    ref_low: 2.12    # 8.5  × 0.2495
    ref_high: 2.62   # 10.5 × 0.2495
    crit_low: 1.50   # 6.0  × 0.2495
    crit_high: 3.24  # 13.0 × 0.2495

  ionized_calcium:
    uri: "loinc:17864-0"
    name: "Ionized calcium"
    qualifiers:
      - "ionized"
      - "ica"
      - "free"
      - "ionized calcium"
    unit: "mg/dL"
    ref_low: 4.5
    ref_high: 5.6
    crit_low: 3.0
    crit_high: 6.5

  # mmol/L entry for ionized calcium (values converted from mg/dL via factor 0.2495)
  ionized_calcium_mmol:
    uri: "loinc:17864-0"
    name: "Ionized calcium"
    qualifiers:
      - "ionized"
      - "ica"
      - "free"
      - "ionized calcium"
    unit: "mmol/L"
    ref_low: 1.12    # 4.5 × 0.2495
    ref_high: 1.40   # 5.6 × 0.2495
    crit_low: 0.75   # 3.0 × 0.2495
    crit_high: 1.62  # 6.5 × 0.2495

collision_families:
  calcium_lookalike:
    family_name: "Calcium Assays"
    assays:
      - "total_calcium"
      - "ionized_calcium"
    trigger_unit: "mg/dL"
    default_qualifier_required: true

  calcium_lookalike_mmol:
    family_name: "Calcium Assays (mmol/L)"
    assays:
      - "total_calcium_mmol"
      - "ionized_calcium_mmol"
    trigger_unit: "mmol/L"
    default_qualifier_required: true
