# Numeric Reference and Critical Ranges with Range Collision Rules
# Prevents lethal misinterpretations between look-alike assays.

domain: "laboratory_medicine"
version: "1.0.0"

assays:
  total_calcium:
    uri: "loinc:17861-6"
    name: "Total calcium"
    qualifiers:
      - "total"
      - "tca"
      - "total calcium"
    unit: "mg/dL"
    ref_low: 8.5
    ref_high: 10.5
    crit_low: 6.0
    crit_high: 13.0

  ionized_calcium:
    uri: "loinc:17864-0"
    name: "Ionized calcium"
    qualifiers:
      - "ionized"
      - "ica"
      - "free"
      - "ionized calcium"
    unit: "mg/dL"
    ref_low: 4.5
    ref_high: 5.6
    crit_low: 3.0
    crit_high: 6.5

collision_families:
  calcium_lookalike:
    family_name: "Calcium Assays"
    assays:
      - "total_calcium"
      - "ionized_calcium"
    trigger_unit: "mg/dL"
    default_qualifier_required: true
